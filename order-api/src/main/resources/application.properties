spring.application.name=order-api
server.port=8400

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.config.import=consul:

# Padrões de desenvolvimento (sobrescritos pelo Consul KV: config/order-api/...)
spring.datasource.url=jdbc:postgresql://localhost:5432/db_order
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

# gateway.secret SEM valor padrão: Consul KV (config/application/gateway.secret) ou env GATEWAY_SECRET.

# Registro no Consul por IP (nome do PC com acento, ex.: "Vinícius", quebra a URL do load balancer)
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.ip-address=${DISCOVERY_IP:127.0.0.1}
