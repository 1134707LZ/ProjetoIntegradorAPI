spring.application.name=auth-api
server.port=8200

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.config.import=consul:

# Valores padrão para desenvolvimento (sobrescritos pelo Consul KV: config/auth-api/...)
spring.datasource.url=jdbc:postgresql://localhost:5432/db_user
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

# jwt.secret SEM valor padrão (HS256, >= 32 bytes, igual ao do gateway-api).
# Definir no Consul KV (config/auth-api/jwt.secret) ou variável de ambiente JWT_SECRET.
jwt.expiration-minutes=120

# gateway.secret SEM valor padrão: Consul KV (config/application/gateway.secret) ou env GATEWAY_SECRET.

# Registro no Consul por IP (nome do PC com acento, ex.: "Vinícius", quebra a URL do load balancer)
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.ip-address=${DISCOVERY_IP:127.0.0.1}
